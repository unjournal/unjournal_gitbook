[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/global-development/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/animal-welfare/*"
  to = "/index.html"
  status = 200
